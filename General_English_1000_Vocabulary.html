let voices=[],currentSentence='';
function catId(n){return 'cat-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function speak(text,btn){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=voices[0]||null;u.lang='en-US';u.rate=.82;u.pitch=1;u.volume=1;if(btn)btn.classList.add('reading');u.onend=u.onerror=()=>btn&&btn.classList.remove('reading');speechSynthesis.speak(u)}

function render(){categories.forEach(name=>{const count=vocabulary.filter(v=>v.category===name).length;const b=document.createElement('button');b.type='button';b.textContent=`${name} (${count})`;b.onclick=()=>document.getElementById(catId(name)).scrollIntoView({behavior:'smooth'});els.buttons.appendChild(b);const o=document.createElement('option');o.value=catId(name);o.textContent=`${name} (${count})`;els.select.appendChild(o)});categories.forEach(name=>{const rows=vocabulary.filter(v=>v.category===name);const sec=document.createElement('section');sec.className='category';sec.id=catId(name);sec.dataset.name=name;sec.innerHTML=`<div class="cat-head"><h3>${name} (${rows.length})</h3><button class="secondary top-btn" data-top type="button">↑ Top</button></div><div class="table-wrap"><table><tbody></tbody></table></div><div class="cat-foot"><button class="secondary top-btn" data-top type="button">↑ Top</button></div>`;const tb=sec.querySelector('tbody');rows.forEach(r=>{const tr=document.createElement('tr');tr.dataset.search=[r.word,r.meaning,...r.examples.map(e=>e.en)].join(' ').toLowerCase();const forms=r.forms.length?`<div class="forms">${r.forms.map(f=>`<span class="chip">${f.label}: <b>${f.value}</b><button class="secondary" data-form="${f.value}">🔊</button></span>`).join('')}</div>`:'';tr.innerHTML=`<td class="num">${r.number}</td><td><div class="word-title"><span class="mobile-num">${r.number}.</span>${r.word} <span class="meta">(${r.type})</span> <span class="meta">${r.ipa}</span> <button class="secondary word-sound">🔊</button></div>${forms}<div class="meaning"><b>Meaning</b>: ${r.meaning}</div><div class="examples">${r.examples.map((e,i)=>`<div class="ex"><button class="ex-num" type="button">${i+1}</button><button class="sentence" type="button" data-en="${e.en.replace(/"/g,'&quot;')}" data-vi="${e.vi.replace(/"/g,'&quot;')}">${e.en}</button></div>`).join('')}</div></td>`;tr.querySelector('.word-sound').onclick=()=>speak(r.word);tr.querySelectorAll('[data-form]').forEach(x=>x.onclick=()=>speak(x.dataset.form));tr.querySelectorAll('.ex-num').forEach((x,i)=>x.onclick=()=>speak(r.examples[i].en,x));tr.querySelectorAll('.sentence').forEach(x=>x.onclick=()=>openModal(x.dataset.en,x.dataset.vi));tb.appendChild(tr)});els.content.appendChild(sec)});document.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>document.getElementById('top-categories').scrollIntoView({behavior:'smooth'}))}
