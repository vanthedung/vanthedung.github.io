<!doctype html>
<html lang="vn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Vietnamese 1000 Vocabulary</title><style>
html{scroll-behavior:smooth}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Helvetica,sans-serif;line-height:1.45}.wrap{max-width:1180px;margin:0 auto}header{padding:22px 14px;background:#fff;border-bottom:1px solid #dbe3ef}h1{margin:0 0 12px;font-size:clamp(25px,5vw,40px)}button,select,input{font:inherit}button{border:1px solid #1769d2;background:#1769d2;color:#fff;border-radius:6px;padding:8px 10px;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#1769d2}select,input{border:1px solid #bac7d9;border-radius:6px;padding:9px 10px;background:#fff}.panel,.category{background:#fff;border:1px solid #dbe3ef;border-radius:8px;box-shadow:0 10px 30px rgba(23,32,51,.08)}.panel{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px;margin-top:10px}.cats{display:flex;gap:7px;flex-wrap:wrap}.toolbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #dbe3ef;z-index:10}.toolbar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px}main{padding:16px 14px}.category{margin-bottom:20px;overflow:hidden;scroll-margin-top:76px}.cat-head,.cat-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;background:#fbfdff;border-bottom:1px solid #dbe3ef}table{width:100%;border-collapse:collapse;min-width:650px}td{padding:11px;border-bottom:1px solid #dbe3ef;vertical-align:top}td.num{width:54px;color:#65728a;font-weight:700}.word-title{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:18px;font-weight:800}.mobile-num{display:none;color:#65728a}.meta{color:#47566d}.meaning{margin:8px 0 10px;color:#34435a}.examples{display:grid;gap:7px}.ex{display:grid;grid-template-columns:34px 1fr;gap:8px;background:#f7faff;border:1px solid #edf3fb;border-radius:6px;padding:7px 8px}.ex-num{min-width:28px;height:28px;padding:0;border-radius:999px;background:#fff;color:#1769d2}.sentence{border:0;background:transparent;color:#172033;padding:0;text-align:left;text-decoration:underline;text-decoration-color:#c7d5e8;text-underline-offset:3px;font-weight:400}.hidden{display:none!important}#floatTop{display:none;position:fixed;right:16px;bottom:16px;width:50px;height:50px;border-radius:50%;padding:0}#floatTop.show{display:block}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(8,20,38,.54);align-items:center;justify-content:center;padding:16px;z-index:30}.modal{background:#fff;border-radius:8px;max-width:720px;width:100%;padding:18px}@media(max-width:720px){.toolbar{position:static}input,select,.panel button,.panel select{width:100%;min-width:0}table{min-width:0}td.num{display:none}.mobile-num{display:inline}.ex{grid-template-columns:34px minmax(0,1fr)}.cat-head{align-items:stretch;flex-direction:column}}
</style></head><body>
<header><div class="wrap"><h1>General Vietnamese 1000 Vocabulary • 41 Categories</h1><div class="panel"><select id="voiceSelect" aria-label="Vietnamese voice"></select><select id="translateSelect" aria-label="Translate to"><option value="vn">Translate: Vietnamese</option><option value="en">Translate: English</option><option value="es">Translate: Spanish</option></select><button id="stopSpeech" class="secondary" type="button">■ Stop</button><span id="validation"></span></div><div id="top-categories" class="panel cats"></div></div></header>
<nav class="toolbar"><div class="wrap"><label>Category:</label><select id="categorySelect"></select><label>Search:</label><input id="searchBox" type="search" placeholder="Search word, meaning, sentence..."><button class="secondary" data-top type="button">↑ Top</button></div></nav>
<main class="wrap" id="content"></main><button id="floatTop" type="button">↑ Top</button>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalPlay" type="button">🔊</button> <button id="modalClose" class="secondary" type="button">Close</button></div></div>
<script src="General_1000_Vocabulary_Pre_Data.js"></script><script>
const SOURCE="vn", LANGS={en:"English",es:"Spanish",vn:"Vietnamese"}, VOICE_LANG="vi-VN";
const categories=preData.categories, vocabulary=preData.records.map(r=>({number:r.id,category:r.category,type:r.type,...r[SOURCE],translations:r}));
const els={buttons:document.getElementById('top-categories'),select:document.getElementById('categorySelect'),content:document.getElementById('content'),search:document.getElementById('searchBox'),floatTop:document.getElementById('floatTop'),voice:document.getElementById('voiceSelect'),translate:document.getElementById('translateSelect'),stop:document.getElementById('stopSpeech'),modal:document.getElementById('modalBackdrop'),modalTitle:document.getElementById('modalTitle'),modalText:document.getElementById('modalText'),modalPlay:document.getElementById('modalPlay'),modalClose:document.getElementById('modalClose'),validation:document.getElementById('validation')};
let voices=[],currentText='';
function catId(n){return 'cat-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function trans(item){return item.translations[els.translate.value]}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const selected=voices.find(v=>v.name===els.voice.value);u.voice=selected||voices[0]||null;u.lang=VOICE_LANG;u.rate=.82;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(VOICE_LANG.slice(0,2))).sort((a,b)=>{const r=v=>/^vi-VN$/i.test(v.lang)?1:/Vietnam|Vietnamese|Tiếng Việt/i.test(v.name)?2:/^vi/i.test(v.lang||v.name)?3:4;return r(a)-r(b)||a.name.localeCompare(b.name)});els.voice.innerHTML=voices.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('')||'<option>Default Vietnamese voice</option>';const preferred=voices.find(v=>/^vi-VN$/i.test(v.lang))||voices.find(v=>/Vietnam|Vietnamese|Tiếng Việt/i.test(v.name))||voices[0];if(preferred)els.voice.value=preferred.name}
function openModal(text){currentText=text;els.modalTitle.textContent=LANGS[els.translate.value];els.modalText.textContent=text;els.modal.style.display='flex'}
function render(){els.buttons.innerHTML='';els.select.innerHTML='';els.content.innerHTML='';categories.forEach(name=>{const rows=vocabulary.filter(v=>v.category===name);const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=`${name} (${rows.length})`;b.onclick=()=>document.getElementById(catId(name)).scrollIntoView({behavior:'smooth'});els.buttons.appendChild(b);const o=document.createElement('option');o.value=catId(name);o.textContent=b.textContent;els.select.appendChild(o);const sec=document.createElement('section');sec.className='category';sec.id=catId(name);sec.innerHTML=`<div class="cat-head"><h3>${name} (${rows.length})</h3><button class="secondary" data-top type="button">↑ Top</button></div><table><tbody></tbody></table><div class="cat-foot"><button class="secondary" data-top type="button">↑ Top</button></div>`;const tb=sec.querySelector('tbody');rows.forEach(r=>{const t=trans(r);const tr=document.createElement('tr');tr.dataset.search=[r.word,r.meaning,...r.examples,t.word,t.meaning,...t.examples].join(' ').toLowerCase();tr.innerHTML=`<td class="num">${r.number}</td><td><div class="word-title"><span class="mobile-num">${r.number}.</span>${r.word} <span class="meta">(${r.type})</span> <span class="meta">${r.ipa}</span> <button class="secondary word-sound">🔊</button></div><div class="meaning"><b>Meaning</b>: ${r.meaning}<br><b>${LANGS[els.translate.value]}</b>: ${t.word} - ${t.meaning}</div><div class="examples">${r.examples.map((e,i)=>`<div class="ex"><button class="ex-num" type="button">${i+1}</button><button class="sentence" type="button">${e}</button></div>`).join('')}</div></td>`;tr.querySelector('.word-sound').onclick=()=>speak(r.word);tr.querySelectorAll('.ex-num').forEach((x,i)=>x.onclick=()=>speak(r.examples[i]));tr.querySelectorAll('.sentence').forEach((x,i)=>x.onclick=()=>openModal(t.examples[i]||t.meaning));tb.appendChild(tr)});els.content.appendChild(sec)});document.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>document.getElementById('top-categories').scrollIntoView({behavior:'smooth'}))}
function search(){const q=els.search.value.trim().toLowerCase();document.querySelectorAll('.category').forEach(sec=>{let n=0;sec.querySelectorAll('tr').forEach(row=>{const hit=!q||row.dataset.search.includes(q);row.classList.toggle('hidden',!hit);if(hit)n++});sec.classList.toggle('hidden',n===0)})}
render();loadVoices();speechSynthesis.onvoiceschanged=loadVoices;els.translate.onchange=render;els.select.onchange=e=>document.getElementById(e.target.value).scrollIntoView({behavior:'smooth'});els.search.oninput=search;els.floatTop.onclick=()=>document.getElementById('top-categories').scrollIntoView({behavior:'smooth'});els.stop.onclick=()=>speechSynthesis.cancel();els.modalClose.onclick=()=>els.modal.style.display='none';els.modal.onclick=e=>{if(e.target===els.modal)els.modal.style.display='none'};els.modalPlay.onclick=()=>speak(currentText);window.onscroll=()=>els.floatTop.classList.toggle('show',scrollY>420);els.validation.textContent='Validated: '+vocabulary.length+' entries, shared pre-data.';
</script></body></html>
