<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test General Spanish 1000 Vocabulary</title><style>
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,Helvetica,sans-serif;line-height:1.5}.wrap{max-width:920px;margin:0 auto;padding:0 14px}header{background:#fff;border-bottom:1px solid #d9e3f0;padding:20px 0 14px}h1{margin:0 0 12px;font-size:clamp(25px,5vw,40px)}button,select,input{font:inherit}button{border:1px solid #1769d2;background:#1769d2;color:#fff;border-radius:6px;padding:6px 8px;font-weight:700}button.secondary{background:#fff;color:#1769d2}select,input{border:1px solid #bac7d9;border-radius:6px;padding:9px 10px;background:#fff}.toolbar,.options,.card,.stats,.result-panel{background:#fff;border:1px solid #d9e3f0;border-radius:8px;box-shadow:0 10px 30px rgba(23,32,51,.08)}.toolbar,.options{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;margin-top:10px}.toolbar select{flex:1;min-width:150px}.check-option{display:inline-flex;align-items:center;gap:6px;font-weight:700}.card{margin:16px 0;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px;margin:12px 0}.stat{background:#f8fbff;border:1px solid #edf3fb;border-radius:6px;padding:4px;text-align:center}.stat span{font-size:10px}.stat b{display:block;font-size:14px}#answer{width:100%;font-size:22px;font-weight:700}.button-bar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}.button-bar button{min-height:28px;padding:3px 4px}.meaning{margin:12px 0;padding:12px;background:#f8fbff;border:1px solid #edf3fb;border-radius:8px;font-size:18px}.hidden{display:none!important}.result-panel{display:none;padding:12px;margin-top:12px}.result-panel.show{display:block}.correct{color:#137a4c;font-weight:800}.wrong{color:#c33030;font-weight:800}.missing-char{color:#c33030;background:#ffe1e1;border-radius:3px}.compare-line{white-space:pre-wrap}.compare-label{display:inline-block;min-width:118px;font-weight:800;color:#47566d}@media(max-width:720px){.toolbar select,.toolbar button{min-width:0}.options{gap:6px}.check-option{font-size:13px}body.typing .stats{display:none}}
</style></head><body><header><div class="wrap"><h1>Test General Spanish 1000 Vocabulary</h1><div class="toolbar"><select id="categorySelect"></select><select id="modeSelect"><option value="all">All words</option><option value="unseen">Unseen first</option><option value="wrong">Practice wrong words</option></select><select id="translateSelect"><option value="vn">Translate: Vietnamese</option><option value="en">Translate: English</option><option value="es">Translate: Spanish</option></select><select id="voiceSelect" aria-label="Spanish voice"></select></div><div class="options"><label class="check-option"><input id="autoPlay" type="checkbox"> Auto Play</label><label class="check-option"><input id="showMeaning" type="checkbox" checked> Meaning</label><label class="check-option"><input id="showIpa" type="checkbox"> IPA</label><label class="check-option"><input id="sentenceShort" type="checkbox"> Sentence Short</label><label class="check-option"><input id="sentenceLong" type="checkbox"> Sentence Long</label></div></div></header><main class="wrap"><section class="stats"><div class="stat"><span>Question</span><b id="qNum">1</b></div><div class="stat"><span>Correct</span><b id="correctCount">0</b></div><div class="stat"><span>Wrong</span><b id="wrongCount">0</b></div><div class="stat"><span>Match</span><b id="matchPct">0%</b></div></section><section class="card"><div id="ipaBlock" class="hidden"></div><div id="meaningBlock" class="meaning"></div><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type answer"><div class="button-bar"><button id="checkBtn">✓</button><button id="backBtn">←</button><button id="nextBtn">→</button><button id="showBtn">👁</button><button id="againBtn">↻</button><button id="clearStats">⌫</button><button id="soundBtn">🔊</button></div><div id="resultPanel" class="result-panel"></div></section></main><script src="General_1000_Vocabulary_Pre_Data.js"></script><script>
const SOURCE="es", VOICE_LANG="es-MX", LANGS={en:"English",es:"Spanish",vn:"Vietnamese"};const categories=preData.categories;const vocabulary=preData.records.map(r=>({number:r.id,category:r.category,type:r.type,...r[SOURCE],translations:r}));const els={categorySelect:document.getElementById('categorySelect'),modeSelect:document.getElementById('modeSelect'),translate:document.getElementById('translateSelect'),voice:document.getElementById('voiceSelect'),autoPlay:document.getElementById('autoPlay'),showMeaning:document.getElementById('showMeaning'),showIpa:document.getElementById('showIpa'),sentenceShort:document.getElementById('sentenceShort'),sentenceLong:document.getElementById('sentenceLong'),ipaBlock:document.getElementById('ipaBlock'),meaningBlock:document.getElementById('meaningBlock'),answer:document.getElementById('answer'),checkBtn:document.getElementById('checkBtn'),backBtn:document.getElementById('backBtn'),nextBtn:document.getElementById('nextBtn'),showBtn:document.getElementById('showBtn'),againBtn:document.getElementById('againBtn'),clearStats:document.getElementById('clearStats'),soundBtn:document.getElementById('soundBtn'),resultPanel:document.getElementById('resultPanel'),qNum:document.getElementById('qNum'),correctCount:document.getElementById('correctCount'),wrongCount:document.getElementById('wrongCount'),matchPct:document.getElementById('matchPct')};let voices=[],current=null,history=[],idx=-1,checkedValue=null;const stats=JSON.parse(localStorage.getItem('test-'+SOURCE)||'{"correct":0,"wrong":0,"wrongWords":[]}');function saveStats(){localStorage.setItem('test-'+SOURCE,JSON.stringify(stats))}function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(VOICE_LANG.slice(0,2))).sort((a,b)=>{const r=v=>/^es-MX$/i.test(v.lang)?1:/Mexico|México/i.test(v.name)?2:/Google.*español|Google.*Spanish/i.test(v.name)?3:/Microsoft.*Spanish|Microsoft.*Español/i.test(v.name)?4:/^es/i.test(v.lang||v.name)?5:6;return r(a)-r(b)||a.name.localeCompare(b.name)});els.voice.innerHTML=voices.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('')||'<option>Default Spanish voice</option>';const preferred=voices.find(v=>/^es-MX$/i.test(v.lang))||voices.find(v=>/Mexico|México/i.test(v.name))||voices[0];if(preferred)els.voice.value=preferred.name}function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=voices.find(v=>v.name===els.voice.value)||voices[0]||null;u.lang=VOICE_LANG;u.rate=.82;speechSynthesis.speak(u)}function target(){if(els.sentenceShort.checked)return current.examples[0];if(els.sentenceLong.checked)return current.examples[2];return current.word}function pool(){let p=vocabulary;if(els.categorySelect.value!=='all')p=p.filter(x=>x.category===els.categorySelect.value);if(els.modeSelect.value==='wrong')p=p.filter(x=>stats.wrongWords.includes(x.word));return p.length?p:vocabulary}function pick(offset=0){if(offset&&history[idx+offset]){idx+=offset;current=history[idx]}else{const p=pool();current=p[Math.floor(Math.random()*p.length)];history=history.slice(0,idx+1);history.push(current);idx=history.length-1}checkedValue=null;els.answer.value='';els.resultPanel.classList.remove('show');renderClue();els.answer.focus();if(els.autoPlay.checked)speak(target())}function renderClue(){const tr=current.translations[els.translate.value];els.ipaBlock.textContent=current.ipa;els.ipaBlock.classList.toggle('hidden',!els.showIpa.checked);els.meaningBlock.classList.toggle('hidden',!els.showMeaning.checked);els.meaningBlock.innerHTML=`<b>Meaning</b>: ${current.meaning}<br><b>${LANGS[els.translate.value]}</b>: ${tr.word} - ${tr.meaning}`;els.qNum.textContent=history.length;els.correctCount.textContent=stats.correct;els.wrongCount.textContent=stats.wrong;const total=stats.correct+stats.wrong;els.matchPct.textContent=total?Math.round(stats.correct/total*100)+'%':'0%'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function compare(){const a=els.answer.value.trim(), c=target();let out='';for(let i=0;i<c.length;i++){out+=a[i]&&a[i].toLowerCase()===c[i].toLowerCase()?esc(c[i]):`<span class="missing-char">${esc(c[i]||' ')}</span>`}const ok=a.toLowerCase()===c.toLowerCase();stats[ok?'correct':'wrong']++;if(!ok&&!stats.wrongWords.includes(current.word))stats.wrongWords.push(current.word);saveStats();checkedValue=a;els.resultPanel.className='result-panel show';els.resultPanel.innerHTML=`<div class="${ok?'correct':'wrong'}">${ok?'Correct':'Try again'}</div><div class="compare-line"><span class="compare-label">Your answer   :</span>${esc(a)}</div><div class="compare-line"><span class="compare-label">Correct answer:</span>${out}</div>`;renderClue()}function categoryOptions(){els.categorySelect.innerHTML=`<option value="all">All categories (${vocabulary.length})</option>`+categories.map(c=>`<option value="${c}">${c} (${vocabulary.filter(v=>v.category===c).length})</option>`).join('')}categoryOptions();loadVoices();speechSynthesis.onvoiceschanged=loadVoices;els.translate.onchange=renderClue;els.showMeaning.onchange=renderClue;els.showIpa.onchange=renderClue;els.sentenceShort.onchange=()=>{if(els.sentenceShort.checked)els.sentenceLong.checked=false;pick()};els.sentenceLong.onchange=()=>{if(els.sentenceLong.checked)els.sentenceShort.checked=false;pick()};els.categorySelect.onchange=()=>pick();els.modeSelect.onchange=()=>pick();els.checkBtn.onclick=compare;els.nextBtn.onclick=()=>pick();els.backBtn.onclick=()=>pick(-1);els.soundBtn.onclick=()=>speak(target());els.againBtn.onclick=()=>{els.answer.value='';speak(target())};els.showBtn.onclick=()=>{els.answer.value=target();compare()};els.clearStats.onclick=()=>{stats.correct=0;stats.wrong=0;stats.wrongWords=[];saveStats();renderClue()};els.answer.onfocus=()=>document.body.classList.add('typing');els.answer.onblur=()=>document.body.classList.remove('typing');els.answer.onkeydown=e=>{if(e.key==='Enter'){if(checkedValue!==null&&els.answer.value.trim()===checkedValue)pick();else compare()}};document.onkeydown=e=>{if(e.key==='ArrowRight')pick();if(e.key==='ArrowLeft')pick(-1)};pick();
</script></body></html>
